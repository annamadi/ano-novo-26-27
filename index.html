<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Planejamento de uma viagem em grupo: cardápio, compras e o que levar.">
<meta name="theme-color" content="#16202A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ano Novo 26/27">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ano Novo 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Sofia+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=2026112720203">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-box">
    <h1>Ano Novo 26/27</h1>
    <p>Entre com seu username e a senha do grupo para ver e editar o plano da viagem.</p>
    <label for="who">Username</label>
    <input id="who" type="text" autocomplete="username" autocapitalize="none" enterkeyhint="next" required>
    <label for="pw">Senha do grupo</label>
    <div class="pwrow"><input id="pw" type="password" autocomplete="current-password" enterkeyhint="go" required><button type="button" id="pw-show" class="ghost" aria-pressed="false">Mostrar</button></div>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="login-err" class="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden data-sec="plano">
  <a class="skip" href="#view">Pular para o conteúdo</a>
  <div class="mini" id="mini"></div>
  <header class="top" id="top"></header>
  <nav class="sub" id="sub" aria-label="Planejamento">
    <button data-tab="menu">Cardápio</button>
    <button data-tab="recipes">Receitas</button>
    <button data-tab="home">Casa</button>
    <button data-tab="fun">Entretenimento</button>
  </nav>
  <main id="view" tabindex="-1"></main>
  <nav class="bar" id="tabs" aria-label="Seções">
    <button data-tab="plano" data-sec="plano"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Plano</button>
    <button data-tab="shop" data-sec="compras"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20.5 8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span>Compras</button>
    <button data-tab="take" data-sec="levar"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M9 8V6a3 3 0 0 1 6 0v2M4 13h16"/></svg></span>Levar</button>
    <button data-tab="mine" data-sec="minha"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/></svg></span>Minha lista</button>
    <button data-tab="pend" data-sec="pend"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2.9-1.2 1.8M12 16.8v.2"/></svg></span>Pendências</button>
  </nav>
</div>
<div id="sync" class="sync" role="status" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=2026112720203"></script>
<script src="app.js?v=2026112720203"></script>
</body>
</html>
