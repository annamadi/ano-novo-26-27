<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E7C86">
<title>Ano Novo 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-box">
    <h1>Ano Novo 26/27</h1>
    <p>Entre com seu username e a senha do grupo para ver e editar o plano da viagem.</p>
    <label for="who">Username</label>
    <input id="who" type="text" autocomplete="username" autocapitalize="none" required>
    <label for="pw">Senha do grupo</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="login-err" class="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <h1>Ano Novo 26/27</h1>
      <p id="status" class="status"></p>
    </div>
    <svg class="wave" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 18 C 100 2, 200 34, 300 18 S 500 2, 600 18 S 800 34, 900 18 S 1100 2, 1200 18 V40 H0 Z"/>
    </svg>
  </header>
  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-tab="menu">Cardápio</button>
    <button data-tab="recipes">Receitas</button>
    <button data-tab="shop">Compras</button>
    <button data-tab="pend">Pendências</button>
    <button data-tab="extras">Levar e gincanas</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
